# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - belfield-sops

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Prepare standalone deployment package
        run: |
          mkdir -p deploy-pkg
          # Copy standalone output including hidden files (.next)
          cp -r .next/standalone/. deploy-pkg/
          
          # Next.js standalone requires static assets copied explicitly
          mkdir -p deploy-pkg/.next/static
          cp -r .next/static/. deploy-pkg/.next/static/
          
          # Copy public directory if it exists
          if [ -d "public" ]; then cp -r public/. deploy-pkg/public/; fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-pkg
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D85920FDF7041DF87824BF528767020 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3213749E87334156A63B02BC7C1AAD67 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6B91DF5A6CF47099ED785B555D4E11B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'belfield-sops'
          slot-name: 'Production'
          package: .
